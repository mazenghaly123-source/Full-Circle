name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # actions are pinned to the commit of the release named in the comment, so a moved tag cannot
    # change what runs; update the hash and the comment together
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run check
      - name: Build
        run: npm run build
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Parity, behaviour and CSS tests
        run: npm test
        env:
          CI: 'true'
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # The database and the form functions on a local Supabase (docs/production-plan.md, phase 2): who
  # can reach which table, the functions' types, and what a request or message leaves behind.
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_CLI: supabase@2.121.0
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Start a local Supabase
        # the functions talk to stand-ins for Turnstile, Resend and Meta, served by
        # tests/unit/backend.spec.ts; Auth signs its calls to send-sms with a secret made for this run
        run: |
          SEND_SMS_HOOK_SECRET="v1,whsec_$(openssl rand -base64 32)"
          export SEND_SMS_HOOK_SECRET
          echo "SEND_SMS_HOOK_SECRET=$SEND_SMS_HOOK_SECRET" >> "$GITHUB_ENV"
          cat > supabase/functions/.env <<EOF
          TURNSTILE_VERIFY_URL=http://host.docker.internal:54399/siteverify
          RESEND_API_URL=http://host.docker.internal:54399/emails
          RESEND_API_KEY=test
          STAFF_EMAILS=staff@fullcircle.test
          WHATSAPP_API_URL=http://host.docker.internal:54399/whatsapp
          WHATSAPP_TOKEN=test
          WHATSAPP_PHONE_ID=100200300
          WHATSAPP_APP_SECRET=test-app-secret
          WHATSAPP_VERIFY_TOKEN=test-verify-token
          SEND_SMS_HOOK_SECRET=$SEND_SMS_HOOK_SECRET
          EOF
          npx --yes "$SUPABASE_CLI" start -x studio,imgproxy,realtime,logflare,vector,supavisor,postgres-meta,mailpit
      - name: Database access tests
        run: npx --yes "$SUPABASE_CLI" test db
      - name: Type-check the Edge Functions
        run: docker run --rm -v "$PWD:/app" -w /app denoland/deno:2.5.6 sh -c "deno check supabase/functions/*/index.ts"
      - name: Form functions end to end
        run: |
          eval "$(npx --yes "$SUPABASE_CLI" status -o env)"
          SUPABASE_URL="$API_URL" SUPABASE_SECRET_KEY="$SECRET_KEY" SUPABASE_PUBLISHABLE_KEY="$PUBLISHABLE_KEY" NO_SITE=1 npx playwright test --project unit
      - name: Function and Auth logs
        if: failure()
        run: |
          docker logs supabase_edge_runtime_full-circle 2>&1 | tail -200
          docker logs supabase_auth_full-circle 2>&1 | tail -60
