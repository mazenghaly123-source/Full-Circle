name: IndexNow

# After main deploys (Cloudflare builds it a few minutes after the push), tell IndexNow which pages
# changed, so Bing and the engines that share IndexNow crawl them soon (scripts/indexnow.mjs).
on:
  push:
    branches: [main]
    paths: ['src/**', 'public/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Wait for Cloudflare to deploy main
        run: sleep 480
      - name: Submit the changed pages
        run: node scripts/indexnow.mjs
